version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/property-platform
      - JWT_SECRET=production-secure-jwt-secret-key-change-me
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:7.0-alpine
    container_name: property-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
